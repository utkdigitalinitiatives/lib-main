id: makerspace_instruction_request
title: 'Makerspace Instruction Request'
description: ''
categories: {  }
elements: |-
  name_fields:
    '#type': webform_flexbox
    first_name:
      '#type': textfield
      '#title': 'First Name'
      '#required': true
    last_name:
      '#type': textfield
      '#title': 'Last Name'
      '#required': true
  netid:
    '#type': textfield
    '#title': NetID
    '#required': true
  email:
    '#type': email
    '#title': 'Email (UTK Email preferred)'
  department:
    '#type': textfield
    '#title': Department
    '#required': true
  course_name_and_number:
    '#type': textfield
    '#title': 'Course Name and Number'
    '#description': '<p>Example: ENGR 221</p>'
    '#required': true
  location:
    '#type': webform_radios_other
    '#title': 'Where would you like the instruction to be held?'
    '#options':
      'Makerspace workshop room ': 'Makerspace workshop room '
      'Makerspace front room': 'Makerspace front room'
    '#other__option_label': 'Another place on campus'
    '#required': true
  project:
    '#type': textarea
    '#title': 'Please describe the type of project you are assigning (general project information or specific software if known)'
    '#required': true
  leading:
    '#type': radios
    '#title': 'Do you need makerspace staff to lead the workshop or are you leading the workshop?'
    '#options':
      'I am leading the workshop (I just need to use the makerspace)': 'I am leading the workshop (I just need to use the makerspace)'
      'I need makerspace staff to lead the workshop': 'I need makerspace staff to lead the workshop'
    '#required': true
  makerspace_supplies:
    '#type': radios
    '#title': 'The makerspace provides general access to equipment and some limited supplies. Will you be providing consumable supplies needed for the class project?'
    '#options':
      'Yes': 'Yes, I will be providing project supplies and just need access to makerspace equipment'
      'No': 'No, I need some supplies from the makerspace (must be approved by makerspace staff)'
    '#required': true
  what_supplies_are_needed:
    '#type': textarea
    '#title': 'What supplies are needed?'
    '#states':
      visible:
        ':input[name="makerspace_supplies"]':
          value: 'No'
    '#required': true
  makerspace_equipment:
    '#type': textarea
    '#title': 'What makerspace equipment will you need for the workshop?'
    '#required': true
  class_meeting_schedule:
    '#type': select
    '#title': 'Class Meeting Schedule'
    '#options':
      'M, W, F': 'M, W, F'
      'T, R': 'T, R'
      'M, W': 'M, W'
      M: M
      T: T
      W: W
      R: R
      F: F
      M-F: M-F
    '#required': true
  first_session:
    '#type': fieldset
    '#title': 'First Session'
    '#required': true
    preferred_date:
      '#type': date
      '#title': 'Preferred Date'
      '#required': true
      '#date_date_min': '-0 Days'
      '#date_days':
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
    alternate_date:
      '#type': date
      '#title': 'Alternate Date'
      '#required': true
      '#date_date_min': '-0 Days'
      '#date_days':
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
    session_start_time:
      '#type': webform_time
      '#title': 'Session Start Time'
      '#required': true
      '#time_format': 'g:i A'
    session_end_time:
      '#type': webform_time
      '#title': 'Session End Time'
      '#required': true
      '#time_format': 'g:i A'
  is_a_second_session_needed:
    '#type': radios
    '#title': 'Is a second session needed?'
    '#options': yes_no
    '#default_value': 'No'
  second_session:
    '#type': fieldset
    '#title': 'Second Session'
    '#states':
      visible:
        ':input[name="is_a_second_session_needed"]':
          value: 'Yes'
    2nd_session_preferred_date:
      '#type': date
      '#title': 'Preferred Date'
      '#required': true
      '#date_date_min': '-0 Days'
      '#date_days':
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
    2nd_session_alternate_date:
      '#type': date
      '#title': 'Alternate Date'
      '#date_date_min': '-0 Days'
      '#date_days':
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
      '#required': true
    2nd_session_start_time:
      '#type': webform_time
      '#title': 'Session Start Time'
      '#required': true
      '#time_format': 'g:i A'
    2nd_session_end_time:
      '#type': webform_time
      '#title': 'Session End Time'
      '#required': true
      '#time_format': 'g:i A'
  is_a_third_session_needed:
    '#type': radios
    '#title': 'Is a third session needed'
    '#options': yes_no
    '#states':
      visible:
        ':input[name="is_a_second_session_needed"]':
          value: 'Yes'
    '#default_value': 'No'
  third_session:
    '#type': fieldset
    '#title': 'Third Session'
    '#states':
      visible:
        ':input[name="is_a_third_session_needed"]':
          value: 'Yes'
    3rd_session_preferred_date:
      '#type': date
      '#title': 'Preferred Date'
      '#required': true
      '#date_date_min': '-0 Days'
      '#date_days':
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
    3rd_session_alternate_date:
      '#type': date
      '#title': 'Alternate Date'
      '#required': true
      '#date_date_min': '-0 Days'
      '#date_days':
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
    3rd_session_start_time:
      '#type': webform_time
      '#title': 'Session Start Time'
      '#required': true
      '#time_format': 'g:i A'
    3rd_session_end_time:
      '#type': webform_time
      '#title': 'Session End Time'
      '#required': true
      '#time_format': 'g:i A'
  additional_information:
    '#type': textarea
    '#title': 'Is there any additional information you wish to provide?'
