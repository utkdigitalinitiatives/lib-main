id: slac_nomination_form
title: 'SLAC Nomination Form'
description: '<p>Form for SLAC Nominations</p>'
categories: {  }
elements: |-
  page_1:
    '#type': webform_wizard_page
    '#title': 'Page 1'
    form_message:
      '#type': webform_markup
      '#markup': '<p><em>The Libraries’ Student Advisory Committee (SLAC) is seeking engaged, thoughtful students to participate in this year’s activities. If you’re ready to represent student voices and contribute to your campus community, we encourage you to nominate yourself or a fellow student. Please complete the brief form below to be considered!</em></p>'
    email:
      '#type': email
      '#title': 'Email (must be @utk.edu, @tennessee.edu, or @vols.utk.edu)'
      '#required': true
      '#pattern': '(^.*)(\@utk\.edu|\@tennessee\.edu|\@vols\.utk\.edu)'
      '#pattern_error': 'Must be @utk.edu, @tennessee.edu, @vols.utk.edu'
    first_name:
      '#type': textfield
      '#title': 'First Name'
      '#required': true
    last_name:
      '#type': textfield
      '#title': 'Last Name'
      '#required': true
    what_is_your_year_in_school:
      '#type': radios
      '#title': 'What is your year in school'
      '#options':
        Freshman: Freshman
        Sophomore: Sophomore
        Junior: Junior
        Senior: Senior
        'Graduate/Professional Student': 'Graduate/Professional Student'
      '#required': true
  page_2:
    '#type': webform_wizard_page
    '#title': 'Page 2'
    why_are_you_interested_in_being_part_of_this_committee_what_pers:
      '#type': textarea
      '#title': 'Why are you interested in being part of this committee? What perspectives, interests, and skills would you bring to it?'
    do_you_have_any_goals_that_this_committee_would_could_help_you_a:
      '#type': textarea
      '#title': 'Do you have any goals that this committee would/could help you achieve?'
    is_there_anything_you_d_like_us_to_know_about_your_schedule_and:
      '#type': textarea
      '#title': "\tIs there anything you’d like us to know about your schedule and availability, such as available or preferred meeting days and times?"
  page_3:
    '#type': webform_wizard_page
    '#title': 'Page 3'
    slac_message_page_3:
      '#type': webform_markup
      '#markup': '<p><em>Which of the following engagement opportunities interests you? Please indicate below. For special events, we will reach out in advance to check on your continued interest and availability.</em></p>'
    provide_feedback_via_virtual_communication_emails_zoom_etc:
      '#type': radios
      '#title': 'Provide feedback via virtual communication (Emails, Zoom, etc)'
      '#options': yes_no
    attend_in_person_meetings_two_times_a_semester:
      '#type': radios
      '#title': 'Attend in-person meetings, two times a semester?'
      '#options': yes_no
    be_involved_with_special_events:
      '#type': radios
      '#title': 'Be involved with special events?'
      '#options': yes_no
    is_there_anything_else_you_d_like_us_to_know_please_use_this_spa:
      '#type': textarea
      '#title': 'Is there anything else you’d like us to know? Please use this space to share any questions.'
