id: appeal_form
title: 'Appeal Form'
description: ''
categories: {  }
elements: |-
  markup:
    '#type': webform_markup
    '#markup': '<p>Submit appeal requests to Hodges Library Public Services Supervisors</p>'
  full_name:
    '#type': webform_flexbox
    first_name:
      '#type': textfield
      '#title': 'First Name'
      '#required': true
    last_name:
      '#type': textfield
      '#title': 'Last Name'
      '#required': true
  library_id:
    '#type': textfield
    '#title': 'Library ID'
    '#description': '<p>For UTK students, staff, or faculty this is your Net ID. For other members, this is shown as your "Alma ID Number" on your library borrowing card.</p>'
    '#required': true
  university_affiliation:
    '#type': webform_select_other
    '#title': 'University Affiliation'
    '#options': utk_affiliation
    '#required': true
  email_address:
    '#type': email
    '#title': 'Email Address (UT provided email preferred)'
    '#description': '<p>Best email address to reach you if we have any questions or need to exchange other types of information with you regarding this fine appeal request.</p>'
    '#required': true
  phone_number:
    '#type': tel
    '#title': 'Phone Number'
    '#description': '<p>Best phone number to contact you if we have any questions.</p>'
    '#required': true
  this_appeal_concerns:
    '#type': webform_select_other
    '#title': 'This Appeal Concerns'
    '#options':
      'Lost or Missing Item(s)': 'Lost or Missing Item(s)'
      'Damaged Item(s)': 'Damaged Item(s)'
      'Phone/Web Renewal': 'Phone/Web Renewal'
      'Overdue Fines': 'Overdue Fines'
      'Equipment Charges': 'Equipment Charges'
    '#required': true
  reason_for_appeal:
    '#type': textarea
    '#title': 'Reason for Appeal'
    '#description': '<p>Please use the space above to explain the circumstances of your appeal. Please include as much detail as possible: when &amp; where the item was checked out; when &amp; where it was returned; date &amp; time of any phone calls or email messages; library staff with whom you spoke, what they said, etc.</p>'
    '#required': true
