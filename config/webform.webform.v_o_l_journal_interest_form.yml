id: v_o_l_journal_interest_form
title: 'V.O.L. Journal Interest Form'
description: ''
categories: {  }
elements: |-
  journal_name:
    '#type': textfield
    '#title': 'Journal Name'
    '#required': true
  journal_status:
    '#type': radios
    '#title': 'Journal Status'
    '#options':
      'Existing Journal': 'Existing Journal -- Existing Journal with past issues'
      'New Journal': 'New Journal'
    '#required': true
  number_of_past_issues:
    '#type': number
    '#title': 'Number of past issues'
    '#description': '<p>Please estimate how many issues you have previously published (we would make these available alongside future publications).</p>'
    '#states':
      visible:
        ':input[name="journal_status"]':
          value: 'Existing Journal'
    '#min': 0
    '#step': 1
  issn:
    '#type': textfield
    '#title': ISSN
    '#states':
      visible:
        ':input[name="journal_status"]':
          value: 'Existing Journal'
  link_to_journal:
    '#type': webform_link
    '#title': 'Link to journal'
    '#description': '<p>If your journal currently exists online, please provide a reliable link to it here.</p>'
    '#title__access': false
  journal_publisher:
    '#type': textfield
    '#title': 'Journal Publisher'
    '#description': '<p>Your society, institute, or organization is the publisher of your journal. UT Libraries is the host and distributor, not the publisher.</p>'
  publication_frequency:
    '#type': textfield
    '#title': 'Publication Frequency'
    '#description': '<p>How regularly have you or would you like to publish new issues?</p>'
  subject_area:
    '#type': textarea
    '#title': 'Subject area'
    '#description': '<p>To what academic discipline(s) or field(s) does your journal pertain? You may explain the subject matter of your journal briefly if you wish.</p>'
    '#required': true
  connection_to_ut:
    '#type': textarea
    '#title': 'Connection to UT'
    '#description': "<p>Please explain this journal's connection to the University of Tennessee (a person who currently works or researches at UT). This person needn't remain at UT or affiliated with your journal forever, only when we establish this partnership.</p><p>Please provide the individual's name, role at UT, and role in your journal.</p>"
    '#required': true
  consent_to_open_access:
    '#type': radios
    '#title': 'Consent to Open Access'
    '#description': '<p>Do you understand and agree that V.O.L. Journals are open access journals, meaning they are available to the public without subscription?</p>'
    '#options':
      'Yes': 'Yes'
      'No': 'No'
      'I have further questions': 'I have further questions'
    '#required': true
  contact_person:
    '#type': textarea
    '#title': 'Contact person'
    '#description': '<p>Whom should we contact to discuss next steps in setting up your journal?</p>'
    '#required': true
  contact_email:
    '#type': email
    '#title': 'Contact email'
    '#description': '<p>Please provide the best email to reach the contact(s) you listed</p>'
    '#required': true
  additional_details_or_questions:
    '#type': textarea
    '#title': 'Additional details or questions'
