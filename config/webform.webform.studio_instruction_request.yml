id: studio_instruction_request
title: 'Studio Instruction Request'
description: ''
categories: {  }
elements: |-
  full_name_flex:
    '#type': webform_flexbox
    first_name:
      '#type': textfield
      '#title': 'First Name'
      '#required': true
    last_name:
      '#type': textfield
      '#title': 'Last Name'
      '#required': true
  net_id:
    '#type': textfield
    '#title': 'Net ID'
  email:
    '#type': email
    '#title': Email
    '#description': '<p>Tennessee email preferred (@utk.edu, @tennessee.edu, or @vols.utk.edu)</p>'
    '#description_display': before
    '#required': true
  department:
    '#type': textfield
    '#title': Department
  course_name_and_number:
    '#type': textfield
    '#title': 'Course Name and Number'
    '#description': '<p>E.g., Art 103, Mark 350, Thea 245&nbsp;</p>'
    '#description_display': before
  instruction_location:
    '#type': radios
    '#title': 'Where would you like the instruction to be held'
    '#options':
      'Library Classroom': 'Library Classroom'
      'My Classroom': 'My Classroom'
      'Online Synchronous': 'Online Synchronous'
      'Online Asynchronous': 'Online Asynchronous/Pre-recorded'
    '#required': true
  class_days:
    '#type': webform_select_other
    '#title': 'Class Days'
    '#options':
      'Mon, Wed, Fri': 'Mon, Wed, Fri'
      'Tue, Thu': 'Tue, Thu'
      'Mon, Wed': 'Mon, Wed'
      Mon: Mon
      Tue: Tue
      Wed: Wed
      Thu: Thu
      Fri: Fri
      Mon-Fri: Mon-Fri
  project_description:
    '#type': textarea
    '#title': 'Project Description'
    '#description': '<p>Please describe the type of project you are assigning (general project information or specific software if known)&nbsp;</p>'
    '#description_display': before
  first_section_scheduling:
    '#type': fieldset
    '#title': 'First section scheduling'
    first_section_preferred_date:
      '#type': date
      '#title': 'First Section Preferred Date'
      '#date_days':
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
    first_section_alternate_date:
      '#type': date
      '#title': 'First Section Alternate Date'
      '#date_days':
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
    start_time:
      '#type': webform_time
      '#title': 'Start Time'
      '#time_format': 'g:i A'
    end_time:
      '#type': webform_time
      '#title': 'End Time'
      '#time_format': 'g:i A'
    number_of_students:
      '#type': number
      '#title': 'Number of students'
      '#step': 1
  do_you_need_a_second_section:
    '#type': select
    '#title': 'Do you need a second section?'
    '#options': yes_no
  second_section_scheduling:
    '#type': fieldset
    '#title': 'Second section scheduling'
    '#states':
      visible:
        ':input[name="do_you_need_a_second_section"]':
          value: 'Yes'
    second_section_preferred_date:
      '#type': date
      '#title': 'Second Section Preferred Date'
      '#date_days':
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
    second_section_alternate_date:
      '#type': date
      '#title': 'Second Section Alternate Date'
      '#date_days':
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
    second_start_time:
      '#type': webform_time
      '#title': 'Start Time'
      '#time_format': 'g:i A'
    second_end_time:
      '#type': webform_time
      '#title': 'End Time'
      '#time_format': 'g:i A'
    second_number_of_students:
      '#type': number
      '#title': 'Number of students'
      '#step': 1
  do_you_need_a_third_section:
    '#type': select
    '#title': 'Do you need a third section'
    '#options': yes_no
    '#states':
      visible:
        ':input[name="do_you_need_a_second_section"]':
          value: 'Yes'
  third_section_scheduling:
    '#type': fieldset
    '#title': 'Third section scheduling'
    '#states':
      visible:
        ':input[name="do_you_need_a_third_section"]':
          value: 'Yes'
    third_section_preferred_date:
      '#type': date
      '#title': 'Third Section Preferred Date'
      '#date_days':
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
    third_section_alternate_date:
      '#type': date
      '#title': 'Third Section Alternate Date'
      '#date_days':
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
    third_start_time:
      '#type': webform_time
      '#title': 'Start Time'
      '#time_format': 'g:i A'
    third_end_time:
      '#type': webform_time
      '#title': 'End Time'
      '#time_format': 'g:i A'
    third_number_of_students:
      '#type': number
      '#title': 'Number of students'
      '#step': 1
  additional_information:
    '#type': textarea
    '#title': 'Additional Information'
    '#description': '<p>Is there any additional information you wish to provide?&nbsp;</p>'
    '#description_display': before
