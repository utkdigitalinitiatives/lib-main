id: oa_mailing_list
title: 'Join The Open Access Mailing List'
description: ''
categories: {  }
elements: |-
  instructions:
    '#type': webform_markup
    '#markup': '<p>Want to stay updated on open access news from the UT Libraries? Sign up to join an informal mailing list where we will share information about the following:</p><ul><li data-list-item-id="e36a67881286eb29520401188baf7d1e9">New open access discounts and fee waivers with pubishers</li><li data-list-item-id="e67c3318020f294a9d214b355c3b8a83f">Open access funds opening and closing announcements</li><li data-list-item-id="ebf4317004a7e2671eb3703c7ef9d7adc">Open Access Week</li><li data-list-item-id="eb56ef996c75d19cbf9b5f1c7f62d0e17">And more!</li></ul><p>Emails will be sent sparingly, only when there is timely news to share.&nbsp;</p>'
  full_name:
    '#type': textfield
    '#title': 'Full Name'
    '#required': true
  ut_email:
    '#type': email
    '#title': 'UT Email'
    '#required': true
    '#pattern': '^[^@]+@(utm\.edu|tennessee\.edu|utsouthern\.edu|utk\.edu|utc\.edu|uthsc\.edu|vols\.utk\.edu)$'
    '#pattern_error': 'Must be a UT email account'
  ut_affiliation:
    '#type': webform_select_other
    '#title': 'UT Affiliation'
    '#options':
      Faculty: Faculty
      Staff: Staff
      Postdoc: Postdoc
      'Graduate Student': 'Graduate Student'
      'Undergraduate Student': 'Undergraduate Student'
    '#required': true
  your_department:
    '#type': textfield
    '#title': 'Your Department'
    '#required': true
  your_college_school:
    '#type': textfield
    '#title': 'Your College/School'
    '#required': true
  oa_interest:
    '#type': textarea
    '#title': 'What types of open access-related information are you interested in hearing about?'
