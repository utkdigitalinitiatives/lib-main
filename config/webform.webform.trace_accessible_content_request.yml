id: trace_accessible_content_request
title: 'TRACE Accessible Content Request'
description: ''
categories: {  }
elements: |-
  markup:
    '#type': webform_markup
    '#markup': '<p><span style="-webkit-text-stroke-width:0px;caret-color:rgb(0, 0, 0);color:rgb(0, 0, 0);font-family:Calibri, sans-serif;font-size:12pt;font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;line-height:18.4px;orphans:auto;text-align:start;text-decoration:none;text-indent:0px;text-transform:none;white-space:normal;widows:auto;word-spacing:0px;">This form is used to request a remediated (accessible) copy of an item found in TRACE, the institutional repository of the University of Tennessee, Knoxville. If you are requesting more than one remediated item, please fill out a separate form for each item. We are committed to making our repository as accessible as possible. Please keep in mind that the time required to complete remediation will depend on the format, size and condition of the original item.&nbsp;</span></p>'
  your_information:
    '#type': fieldset
    '#title': 'Your information'
    full_name:
      '#type': textfield
      '#title': 'Full Name'
      '#required': true
    email:
      '#type': email
      '#title': Email
      '#description': '<p>UT or UTK email preferred</p>'
      '#description_display': before
      '#required': true
    affiliation_with_university_of_tennessee:
      '#type': radios
      '#title': 'Affiliation with University of Tennessee'
      '#options': utk_affiliation_inc_alum
      '#required': true
  item_information:
    '#type': fieldset
    '#title': 'Item information'
    name_of_item:
      '#type': textfield
      '#title': 'Name of Item'
    item_author:
      '#type': textfield
      '#title': 'Item Author'
    item_link:
      '#type': url
      '#title': 'Item link'
      '#description': '<p>Please include the link/URL of the requested item</p>'
      '#description_display': before
  request_information:
    '#type': fieldset
    '#title': 'Request information'
    preferred_formats:
      '#type': textarea
      '#title': 'Preferred format(s)'
      '#description': '<p><span style="-webkit-text-stroke-width:0px;caret-color:rgb(0, 0, 0);color:rgb(0, 0, 0);font-family:Calibri, sans-serif;font-size:12pt;font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;line-height:18.4px;orphans:auto;text-align:start;text-decoration:none;text-indent:0px;text-transform:none;white-space:normal;widows:auto;word-spacing:0px;">Please specify any preferred file formats and/or any assistive tools or technology you normally use to access electronic materials</span></p>'
      '#description_display': before
      '#required': true
    date_needed:
      '#type': date
      '#title': 'Date needed'
      '#description': '<p style="-webkit-text-stroke-width:0px;caret-color:rgb(0, 0, 0);color:rgb(0, 0, 0);font-family:Calibri, sans-serif;font-size:medium;font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;line-height:18.4px;margin:0in 0in 8pt;orphans:auto;text-align:start;text-decoration:none;text-indent:0px;text-transform:none;white-space:normal;widows:auto;word-spacing:0px;">Please indicate the date that you need the materials by. We will do our best to meet this deadline but certain remediation requests can take a bit of time. Please allow as much time as possible to get your remediated content to you.</p>'
      '#description_display': before
      '#required': true
