id: spotlight_request_form
title: 'Spotlight Request Form'
description: ''
categories: {  }
elements: |-
  intro_description:
    '#type': webform_markup
    '#markup': "<h2>Have an idea for the Libraries' Spotlight?</h2><p>The graphic array in the center of the homepage will highlight four to six library services, resources, events, or announcements on a rotating basis. Please provide an illustration or simple photo to represent your topic. Images should be eye-catching within the small square allotted to each spotlight. (See information about image sources, below.) If you do not provide an image, your request may be denied. The Spotlight Committee will select and rotate Spotlight content as they deem necessary to promote library priorities.</p><h2>Submission timelines</h2><p>Please submit your “spotlight” requests at least one week in advance of the desired publication date. This timeline allows our committee enough time to review and approve your request.</p>"
  requestor_name:
    '#type': textfield
    '#title': 'Requestor Name'
    '#required': true
  requestor_email:
    '#type': email
    '#title': 'Requestor email'
    '#description': '<p>Email must end in "@utk.edu", "@tennessee.edu", or "@vols.utk.edu"</p>'
    '#required': true
    '#pattern': '[^@]+@(utk\.edu|tennessee\.edu|vols\.utk\.edu)'
  spotlight_item_name:
    '#type': textfield
    '#title': 'Spotlight Item Name'
    '#required': true
  spotlight_item_url:
    '#type': url
    '#title': 'Spotlight item URL'
    '#description': '<p>Include the full URL, including leading "http://" or "https://"</p>'
    '#required': true
  description:
    '#type': textarea
    '#title': Description
    '#description': '<p>Please provide a brief description of no more than 75 characters (the briefer, the better!) to overlay the spotlight image. Note: Descriptions may be rewritten to align with website style restrictions and preferences.</p>'
    '#required': true
  featured_image:
    '#type': webform_image_file
    '#title': 'Featured image'
    '#description': '<p>We must hold the rights to any photos/clipart used as featured images. Images must either: (a) be created by a library staff member for our use; or (b) be in the public domain; or (c) if you have purchased a license to use the image, you must adhere to any stated restrictions. Some stock images — although free — may require attribution. In all instances, be mindful of the creator’s copyright in their work (see our copyright library guide).</p><p>Possible sources of free images (be sure to check for any restrictions):</p><ul><li><a href="https://utk.photoshelter.com/">utk.photoshelter.com</a> (UT’s stock photos) (NetID log-in)</li><li>For sources of copyright-free images, check out the l<a href="https://libguides.utk.edu/posters/images">ibrary guide on creating Research Posters</a>.</li></ul>'
    '#description_display': before
    '#required': true
    '#sanitize': true
  date_request:
    '#type': fieldset
    '#title': 'Date Request'
    spotlight_date_caveat:
      '#type': webform_markup
      '#markup': '<p>Please enter the date range the item should be included in the Spotlight section of the library homepage below. Note, while we will try to accommodate requested dates, during popular or "in-demand" times, items may not be included on the homepage for all requested dates, or may not be included at all.</p>'
    requested_start_date:
      '#type': date
      '#title': 'Requested Start Date'
      '#required': true
    requested_end_date:
      '#type': date
      '#title': 'Requested End Date'
      '#required': true
  additional_notes:
    '#type': textarea
    '#title': 'Additional notes'
    '#description': '<p>Is there anything else you’d like for us to know about your request?</p>'
