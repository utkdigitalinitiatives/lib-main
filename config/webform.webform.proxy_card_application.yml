id: proxy_card_application
title: 'Proxy Card Application'
description: ''
categories: {  }
elements: |-
  form_description:
    '#type': processed_text
    '#text': '<p><span class="fw-bold">Please read: </span>The Libraries will issue <span class="fw-bold">no more than three</span> Proxy cards per faculty or staff member (one form is required for each card). Proxy cards <span class="fw-bold">DO NOT EXPIRE</span>. Once created they will continue to be valid until you notify us that you want it cancelled.</p><p><span class="fw-bold">Liability Notice: </span>The faculty or staff member assumes full responsibility for all materials checked out on Proxy cards issued in their name. UTK Libraries will not be responsible for confirming the identity of any Proxy Card Holder. Lost or stolen cards should be reported to the Hodges Library Public Services Department as soon as possible.</p><p><span class="fw-bold">Submission Notice: </span>By submitting this form you give consent for an Electronic Signature to be placed on your official Proxy Card Application and state the following:</p><blockquote class="fs-5 fw-bold fst-italic"><p>I would like the University Libraries to issue in my name a Proxy card which, when used, will result in library materials being charged to me. I assume full responsibility for determining who may and who may not use this Proxy card. I understand that materials borrowed on this Proxy are governed by loan policies for faculty or staff, and that I will receive any recall or overdue notice(s) that may be required. I also assume full responsibility for all losses, damages, or fines incurred by the person borrowing under this authorization.</p></blockquote>'
    '#format': full_html
  full_name:
    '#type': textfield
    '#title': 'Full Name'
    '#required': true
  department:
    '#type': textfield
    '#title': Department
    '#required': true
  campus_address:
    '#type': textfield
    '#title': 'Campus Address'
    '#required': true
  utk_email_address:
    '#type': email
    '#title': 'UTK Email Address'
    '#description': '<p>Email must end with @utk.edu, @tennessee.edu, or @vols.utk.edu</p>'
    '#required': true
    '#pattern': '(^.*)(\@utk\.edu|\@tennessee\.edu|\@vols\.utk\.edu)'
  phone_number:
    '#type': tel
    '#title': 'Phone Number'
    '#required': true
  timeline:
    '#type': webform_markup
    '#markup': '<p>Your proxy card will be mailed via campus mail to you within three (3) business days.</p>'
