      '#title': 'Alternate Date Preferred Time'
      '#time_format': 'g:i A'
    alternate_date_alternate_time:
      '#type': webform_time
      '#title': 'Alternate Date Alternate Time'
      '#time_format': 'g:i A'
  consultation_needs:
    '#type': textarea
    '#title': 'Consultation Needs'
    '#description': '<p><span style="-webkit-text-stroke-width:0px;caret-color:rgb(0, 0, 0);color:rgb(0, 0, 0);font-family:Arial, sans-serif;font-size:10.5pt;font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;line-height:15.96px;orphans:auto;text-align:start;text-decoration:none;text-indent:0px;text-transform:none;white-space:normal;widows:auto;word-spacing:0px;">Please describe the type of consultation you need (general project information or specific software if known)</span></p>'
    '#description_display': before
  additional_info:
    '#type': textarea
    '#title': 'Additional Info'
    '#description': '<p><span style="-webkit-text-stroke-width:0px;caret-color:rgb(0, 0, 0);color:rgb(0, 0, 0);font-family:Arial, sans-serif;font-size:10.5pt;font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;line-height:15.96px;orphans:auto;text-align:start;text-decoration:none;text-indent:0px;text-transform:none;white-space:normal;widows:auto;word-spacing:0px;">Please list any other information you think would be helpful&nbsp;</span></p>'
