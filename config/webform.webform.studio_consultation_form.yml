    last_name:
      '#type': textfield
      '#title': 'Last Name'
      '#required': true
  net_id:
    '#type': textfield
    '#title': 'Net ID'
    '#required': true
  utk_email:
    '#type': email
    '#title': 'UTK Email'
    '#description': '<p>Email must end in @utk.edu, @vols.utk.edu, or @tennessee.edu</p>'
    '#required': true
    '#pattern': '(^.*)(\@utk\.edu|\@tennessee\.edu|\@vols\.utk\.edu)'
  first_choice_date:
    '#type': fieldset
    '#title': 'First Choice Date'
    preferred_date:
      '#type': date
      '#title': 'Preferred Date'
    preferred_date_preferred_time:
      '#type': webform_time
      '#title': 'Preferred Date Preferred Time'
      '#time_format': 'g:i A'
    preferred_date_alternate_time:
      '#type': webform_time
      '#title': 'Preferred Date Alternate Time'
      '#time_format': 'g:i A'
  alternate_date:
    '#type': fieldset
    '#title': 'Alternate Date'
