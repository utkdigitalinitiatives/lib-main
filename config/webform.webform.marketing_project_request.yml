id: marketing_project_request
title: 'Marketing Project Request'
description: ''
categories: {  }
elements: |-
  markup:
    '#type': webform_markup
    '#markup': '<p>Need help from the Libraries’ Marketing and Communications team? Please submit your requests at least three weeks in advance — or at least four weeks earlier for larger, more involved requests.</p>'
  general_information:
    '#type': webform_wizard_page
    '#title': 'General Information'
    requestor_information:
      '#type': fieldset
      '#title': 'Requestor Information'
      requestor_name:
        '#type': textfield
        '#title': 'Requestor name'
        '#required': true
      requestor_email:
        '#type': textfield
        '#title': 'Requestor email'
        '#description': '<p>Email must end in @utk.edu, @tennessee.edu, or @vols.utk.edu</p>'
        '#input_mask': "'alias': 'email'"
        '#required': true
        '#pattern': '[^@]+@(utk\.edu|tennessee\.edu|vols\.utk\.edu)'
      requestor_s_supervisor:
        '#type': textfield
        '#title': "Requestor's supervisor"
        '#required': true
      supervisor_s_email:
        '#type': textfield
        '#title': "Supervisor's email"
        '#description': '<p>Email must end in @utk.edu, @tennessee.edu, or @vols.utik.edu</p>'
        '#input_mask': "'alias': 'email'"
        '#required': true
        '#pattern': '[^@]+@(utk\.edu|tennessee\.edu|vols\.utk\.edu)'
    project_basics:
      '#type': fieldset
      '#title': 'Project/Event Basics'
      project_title:
        '#type': textfield
        '#title': 'Project/event title'
        '#required': true
      requested_completion_date:
        '#type': date
        '#title': 'Proposed completion date'
        '#required': true
        '#date_date_min': '-0 days'
      project_launch_date:
        '#type': date
        '#title': 'Project launch/event date'
        '#required': true
        '#date_date_min': '-0 days'
      utk_event_calendar_url:
        '#type': url
        '#title': 'UTK event calendar URL'
        '#description': '<p>If this is for an event, do you have the calendar.utk.edu URL? If yes, provide the URL here.</p>'
  project_scope:
    '#type': webform_wizard_page
    '#title': 'Project/Event Scope'
    requested_services_and_promotion:
      '#type': webform_checkboxes_other
      '#title': 'Requested services and promotion'
      '#options':
        'Social media posts': 'Social media posts'
        'Digital signage': 'Digital signage'
        'Graphic design': 'Graphic design'
        'Printed materials': 'Printed materials -- Describe below'
        'Swag materials': 'Swag materials -- Small quantities of Libraries-branded pens, highlighters, and chip clips are available in the Public Services supply closet in Hodges Library. Request larger quantities here.'
        'Campus newsletter and/or news story': 'Campus newsletter and/or news story -- e.g., Vol Update, Tennessee Today, ORIED weekly, Libraries website'
        'Review my design and/or review my writing': 'Review my design and/or review my writing'
      '#other__type': textarea
      '#other__placeholder': ''
      '#other__description': 'The Marketing & Communications office will review additional requests. Requests that fall outside our scope may be declined.'
      '#required': true
    printed_materials_description:
      '#type': textarea
      '#title': 'Printed materials description'
      '#description': '<p><span style="-webkit-text-stroke-width:0px;caret-color:rgb(255, 255, 255);color:rgb(255, 255, 255);font-family:Aptos, sans-serif;font-size:12pt;font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;line-height:18.4px;orphans:2;text-align:start;text-decoration-line:none;text-decoration-style:solid;text-decoration-thickness:auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Provide a description of all requested printed materials</span></p>'
      '#required': true
      '#states':
        visible:
          ':input[name="requested_services_and_promotion[checkboxes][Printed materials]"]':
            checked: true
    content_creation:
      '#type': radios
      '#title': 'Content creation'
      '#description': '<p><span style="-webkit-text-stroke-width:0px;caret-color:rgb(255, 255, 255);color:rgb(255, 255, 255);font-family:Aptos, sans-serif;font-size:12pt;font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;line-height:18.4px;orphans:2;text-align:start;text-decoration-line:none;text-decoration-style:solid;text-decoration-thickness:auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Who will create the content for this project?</span></p>'
      '#description_display': before
      '#options':
        'I will create content for approval': 'I will create content for approval'
        'I will provide content; Marketing will create design': 'I will provide content; Marketing will create design'
        'Marketing creates the content and design': 'Marketing creates the content and design'
      '#required': true
  project_details:
    '#type': webform_wizard_page
    '#title': 'Project/Event Details'
    description:
      '#type': textfield
      '#title': Description
      '#description': '<p>Provide a one-paragraph description about your event/project and 3-4 key messages you would like featured.&nbsp;</p>'
      '#description_display': before
      '#required': true
    what_is_the_primary_goal_of_this_project:
      '#type': checkboxes
      '#title': 'What is the primary goal of this project? '
      '#options':
        'Student engagement': 'Student engagement'
        'Faculty/staff engagement': 'Faculty/staff engagement'
        'Donor outreach': 'Donor outreach'
        'Community outreach': 'Community outreach'
      '#required': true
    who_is_the_target_audience:
      '#type': webform_checkboxes_other
      '#title': 'Who is the target audience? '
      '#options':
        'On-campus undergraduate and/or on-campus graduate students': 'On-campus undergraduate and/or on-campus graduate students'
        'Online undergraduate and/or online graduate students': 'Online undergraduate and/or online graduate students'
        Faculty/Staff: Faculty/Staff
        Alumni: Alumni
        Donors: Donors
        Community: Community
      '#other__type': textarea
      '#other__description': 'Please provide more detail about your target audience'
      '#required': true
    where_will_your_content_be_used:
      '#type': checkboxes
      '#title': 'Where will your content be used?'
      '#options':
        'On campus': 'On campus'
        'Off campus': 'Off campus'
        Online: Online
      '#required': true
    does_your_event_have_any_sponsors_or_partners:
      '#type': radios
      '#title': 'Does your event have any sponsors or partners'
      '#options': yes_no
      '#required': true
    please_list_the_sponsors_and_partners:
      '#type': textarea
      '#title': 'Please list the sponsors and partners'
      '#required': true
      '#states':
        visible:
          ':input[name="does_your_event_have_any_sponsors_or_partners"]':
            value: 'Yes'
    please_upload_sponsor_logos_if_available:
      '#type': managed_file
      '#title': 'Please upload sponsor logos (if available)'
      '#multiple': true
      '#states':
        visible:
          ':input[name="does_your_event_have_any_sponsors_or_partners"]':
            value: 'Yes'
    additional_details:
      '#type': textarea
      '#title': 'Additional details'
      '#description': '<p><span style="-webkit-text-stroke-width:0px;caret-color:rgb(255, 255, 255);color:rgb(255, 255, 255);font-family:Aptos, sans-serif;font-size:12pt;font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;line-height:18.4px;orphans:2;text-align:start;text-decoration-line:none;text-decoration-style:solid;text-decoration-thickness:auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Any additional details about the event/project you would like us to know about? This could include Canva design links, event format, quantity, co-sponsors, mailing needs, etc</span></p>'
      '#description_display': before
    additional_files:
      '#type': managed_file
      '#title': 'Additional files'
      '#description_display': before
      '#file_placeholder': '<p><span style="-webkit-text-stroke-width:0px;caret-color:rgb(255, 255, 255);color:rgb(255, 255, 255);font-family:Aptos, sans-serif;font-size:12pt;font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;line-height:18.4px;orphans:2;text-align:start;text-decoration-line:none;text-decoration-style:solid;text-decoration-thickness:auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Any supporting documents/files you would like us to have? This could include historical examples, images that you want incorporated into a design, reference files, inspirational items, signage, etc</span></p>'
  approval_and_account:
    '#type': webform_wizard_page
    '#title': 'Approval and Account'
    did_your_event_project_require_you_to_submit_a_library_proposal:
      '#type': radios
      '#title': 'Did your event/project require you to submit a library proposal form?'
      '#options': yes_no
      '#required': true
    attach_a_copy_of_the_approved_library_proposal_confirmation:
      '#type': webform_document_file
      '#title': 'Attach a copy of the approved library proposal confirmation'
      '#required': true
      '#states':
        visible:
          ':input[name="did_your_event_project_require_you_to_submit_a_library_proposal"]':
            value: 'Yes'
    the_dash_chart_string_is_needed_if_we_will_be_providing_you_with:
      '#type': textfield
      '#title': 'The DASH chart string is needed if we will be providing you with printed materials or swag from one of our promotional vendors.'
      '#description': '<p>The chart strings will look as follows (34 characters, not including dashes): 11-1234567-123456-000000-123-1234-00-0000</p><p>*** NOTE: Projects may be placed on hold until we receive this information.</p>'
      '#input_mask': 99-9999999-999999-999999-999-9999-99-9999
