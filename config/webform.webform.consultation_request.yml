id: consultation_request
title: 'Consultation Request'
description: ''
categories: {  }
elements: |-
  introduction:
    '#type': webform_markup
    '#markup': '<p style="-webkit-text-stroke-width:0px;caret-color:rgb(0, 0, 0);color:rgb(0, 0, 0);font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;orphans:auto;text-align:start;text-decoration:none;text-indent:0px;text-transform:none;white-space:normal;widows:auto;word-spacing:0px;">Save time and minimize frustration by making an appointment with a librarian. We can help you...</p><ul style="-webkit-text-stroke-width:0px;caret-color:rgb(0, 0, 0);color:rgb(0, 0, 0);font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;orphans:auto;text-align:start;text-decoration:none;text-indent:0px;text-transform:none;white-space:normal;widows:auto;word-spacing:0px;"><li>Find articles, books, data, primary sources, etc.</li><li>Design search strategies for literature reviews.</li><li>Use citation management tools.</li><li>Create media-enhanced projects.</li><li>Understand scholarly communication issues such as copyright and open access publishing.</li></ul><p style="-webkit-text-stroke-width:0px;caret-color:rgb(0, 0, 0);color:rgb(0, 0, 0);font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;orphans:auto;text-align:start;text-decoration:none;text-indent:0px;text-transform:none;white-space:normal;widows:auto;word-spacing:0px;">Appointments are generally available Monday-Friday from 8:00 am to 6 pm. Please allow 2 business days advance notice.</p><p style="-webkit-text-stroke-width:0px;caret-color:rgb(0, 0, 0);color:rgb(0, 0, 0);font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;orphans:auto;text-align:start;text-decoration:none;text-indent:0px;text-transform:none;white-space:normal;widows:auto;word-spacing:0px;">If you just need to look up a librarian to contact directly about your research needs, please visit <a href="/specialist-list">Subject Librarians</a> list on our directory page.</p>'
  name:
    '#type': textfield
    '#title': Name
    '#required': true
  email:
    '#type': email
    '#title': Email
    '#description': '<p>Note: prefer UTK email address (e.g., @vols.utk.edu, @utk.edu, or @tennessee.edu)</p>'
    '#required': true
  phone:
    '#type': textfield
    '#title': Phone
    '#input_mask': '(999) 999-9999'
  utk_status:
    '#type': radios
    '#title': 'UTK Status'
    '#options':
      Freshman/Sophomore: Freshman/Sophomore
      Junior/Senior: Junior/Senior
      'Graduate Studen': 'Graduate Studen'
      Faculty/Staff: Faculty/Staff
      Community/Public: 'Community/Public -- Or none of the above'
    '#required': true
  major_or_department:
    '#type': textfield
    '#title': 'Major or Department'
    '#description': '<p>If not affiliated with UTK, please enter "N/A"</p>'
    '#required': true
  research_needs:
    '#type': textarea
    '#title': 'Research Needs'
    '#description': '<p>Please describe your research needs. The more information you share with us, the better we can prepare for the appointment.</p>'
    '#required': true
  availability:
    '#type': textarea
    '#title': 'When are you available? (Please list at least 3 possibilities)'
    '#description': '<p><span style="-webkit-text-stroke-width:0px;caret-color:rgb(0, 0, 0);color:rgb(0, 0, 0);display:inline !important;float:none;font-size:medium;font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;orphans:auto;text-align:start;text-decoration:none;text-indent:0px;text-transform:none;white-space:normal;widows:auto;word-spacing:0px;">Tell us what dates and times that you are available to meet with the librarian. Please allow 2 business days advance notice.</span></p>'
    '#required': true
  for_class:
    '#type': radios
    '#title': 'Is this for a class assignment?'
    '#options': yes_no
    '#options_display': side_by_side
    '#required': true
  class_name:
    '#type': textfield
    '#title': 'Class Name'
    '#description': '<p>Please list which class, e.g., ENGL 221 or PSYC 300</p>'
    '#states':
      visible:
        ':input[name="for_class"]':
          value: 'Yes'
  project_status:
    '#type': webform_radios_other
    '#title': 'Project Status'
    '#options':
      "I'm just getting started": "I'm just getting started"
      'I found some information, but need to find more': 'I found some information, but need to find more'
      'I need help with EndNote': 'I need help with EndNote'
    '#required': true
  due_date:
    '#type': date
    '#title': 'Project Due Date (if applicable)'
  accessibility_accommodations:
    '#type': textarea
    '#title': 'Accessibility Accommodations Requests'
    '#description': '<p>If you identify as a person with a disability and wish to disclose your specific accommodations requests in addition to this broader ask, please add those here.</p>'
