# Local-only Solr wiring for DDEV.
# Consumed as a runtime config override in web/sites/default/settings.local.php
# rather than written to config storage, so `drush config:import` never
# breaks the local Solr connection.

web_environment:
  - SOLR_SCHEME=http
  - SOLR_HOST=solr
  - SOLR_PORT=8983
  - SOLR_PATH=/
  - SOLR_CORE=site_search
  - SOLR_USERNAME=solr
  - SOLR_PASSWORD=SolrRocks
