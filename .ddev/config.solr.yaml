# Local-only Solr wiring for DDEV.

web_environment:
  - DRUPAL_SOLR_LOCAL_SCHEME=http
  - DRUPAL_SOLR_LOCAL_HOST=solr
  - DRUPAL_SOLR_LOCAL_PORT=8983
  - DRUPAL_SOLR_LOCAL_PATH=/solr
  - DRUPAL_SOLR_LOCAL_USERNAME=solr
  - DRUPAL_SOLR_LOCAL_PASSWORD=SolrRocks

hooks:
  post-start:
    - exec: /mnt/ddev_config/commands/web/configure-local-solr-drupal
