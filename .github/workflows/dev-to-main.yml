# Enforces that only the dev branch can be merged into main.
# Runs on all PRs but only fails PRs targeting main from non-dev branches.

name: dev-to-main

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: dev-to-main
        run: |
          echo "Base (target) branch: ${{ github.event.pull_request.base.ref }}"
          echo "Head (source) branch: ${{ github.event.pull_request.head.ref }}"

          if [ "${{ github.event.pull_request.head.ref }}" != "dev" ]; then
            echo "ERROR: PRs into main must come from dev only."
            exit 1
          fi

          echo "OK: dev -> main PR."
