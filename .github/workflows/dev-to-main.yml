# Enforces that only the dev branch can be merged into main.
# Triggered for PR activity on main only.

name: dev-to-main

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

jobs:
  enforce:
    # Defensive guard: even if this workflow is re-evaluated from an edited PR,
    # only run when the current target branch is main.
    if: ${{ github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: dev-to-main
        run: |
          echo "Base (target) branch: ${{ github.event.pull_request.base.ref }}"
          echo "Head (source) branch: ${{ github.event.pull_request.head.ref }}"

          if [ "${{ github.event.pull_request.head.ref }}" != "dev" ]; then
            echo "ERROR: PRs into main must come from dev only."
            exit 1
          fi

          echo "OK: dev -> main PR."
