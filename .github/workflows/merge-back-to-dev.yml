# Automatically creates a PR to merge main back into dev after PRs are merged into main.
# This is necessary when using squash merges for main (production) but merge commits for dev (development).
# Squash merges lose the merge commit history, so this action ensures dev stays in sync with main.

name: Merge Back to Dev

on:
  push:
    branches: [main]

jobs:
  merge-back:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DISPATCH_APP_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}

      - name: Create merge-back PR from main to dev
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Check if a PR from main -> dev already exists
          EXISTING_PR=$(gh pr list --base dev --head main --state open --json number --jq '.[0].number')

          if [ ! -z "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists from main to dev. Skipping creation."
            exit 0
          fi

          # Create PR from main to dev
          BODY=$(printf 'Automatic merge-back PR after squash merge to production.\n\nThis PR merges production changes from `main` back to `dev` to keep branches in sync.\n\nDevelopment workflow strategy:\n- PRs into `main` use squash merges (production)\n- PRs into `dev` use merge commits (development)\n\nNote: Conflicts require manual resolution before merging.')

          gh pr create --base dev --head main --title "chore: merge main back to dev" --body "$BODY" --label "automated"

      - name: Request review from team
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Find the merge-back PR
          PR_NUMBER=$(gh pr list \
            --base dev \
            --head main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found from main to dev"
            exit 0
          fi

          # Request review from maintainers team
          gh pr review $PR_NUMBER --request-review @${{ github.repository_owner }}/maintainers 2>/dev/null || echo "Could not request review (team may not exist or may already be requested)"

          echo "Review requested for PR #$PR_NUMBER"
